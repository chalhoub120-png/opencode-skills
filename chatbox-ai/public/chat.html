<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تشات بوكس AI - دردشة ذكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Cairo", "Inter", sans-serif;
        background: #0f0f12;
        color: #f3f4f6;
        direction: rtl;
        text-align: right;
        height: 100vh;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 15, 18, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
      }
      .nav-logo {
        font-size: 1.25rem;
        font-weight: 800;
        color: #f3f4f6;
      }
      .nav-logo span {
        color: #818cf8;
      }
      .nav-middle {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .lang-switcher {
        display: flex;
        gap: 6px;
      }
      .lang-btn {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #374151;
        color: #94a3b8;
        font-size: 0.85rem;
        font-weight: 700;
        background: transparent;
      }
      .lang-btn.active {
        border-color: #6366f1;
        color: #f3f4f6;
        background: rgba(99, 102, 241, 0.15);
      }
      .app-container {
        display: flex;
        height: calc(100vh - 64px);
      }
      .sidebar {
        width: 280px;
        background: #0a0a0c;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        padding: 24px;
        overflow-y: auto;
      }
      .sidebar h3 {
        font-size: 1rem;
        font-weight: 800;
        margin-bottom: 16px;
        color: #f3f4f6;
      }
      .new-chat {
        width: 100%;
        padding: 10px 16px;
        background: transparent;
        border: 1px solid #374151;
        color: #cbd5e1;
        border-radius: 8px;
        font-weight: 700;
        margin-bottom: 20px;
        cursor: pointer;
      }
      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chat-item {
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        color: #cbd5e1;
        font-size: 0.9rem;
        cursor: pointer;
        text-align: right;
      }
      .chat-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .chat-header {
        padding: 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .chat-header h2 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .chat-header p {
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: 80%;
      }
      .message.ai {
        align-self: flex-start;
      }
      .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .bubble {
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 0.95rem;
        line-height: 1.6;
        white-space: pre-wrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        text-align: right;
      }
      .message.ai .bubble {
        background: #1f2937;
        color: #f3f4f6;
        border-bottom-left-radius: 4px;
      }
      .message.user .bubble {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .typing {
        align-self: flex-start;
        max-width: 80%;
        padding-right: 10px;
      }
      .typing .bubble.ai {
        background: #1f2937;
        font-size: 0.85rem;
        color: #94a3b8;
        font-style: italic;
        padding: 8px 12px;
        border-radius: 10px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .typing .bubble.ai::after {
        content: "...";
        animation: typing 1.4s infinite;
      }
      @keyframes typing {
        0%,
        60%,
        100% {
          content: ".";
        }
        30% {
          content: "..";
        }
      }
      .upload-zone {
        align-self: flex-start;
        max-width: 80%;
        padding: 8px 12px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px dashed rgba(99, 102, 241, 0.4);
        border-radius: 10px;
        font-size: 0.85rem;
        color: #a5b4fc;
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .input-form {
        padding: 20px 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        background: #0a0a0c;
        display: flex;
        gap: 8px;
      }
      .input-form input {
        flex: 1;
        background: #1e1e24;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #f3f4f6;
        padding: 10px 16px;
        font-family: inherit;
        font-size: 0.95rem;
      }
      .input-form input::placeholder {
        color: #6b7280;
      }
      .attach-btn {
        background: #1e1e24;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        border-radius: 8px;
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .input-form button[type="submit"] {
        background: #6366f1;
        color: #fff;
        padding: 0 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
        transition: 0.2s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
      }
      .btn-outline {
        background: transparent;
        color: #cbd5e1;
        border: 1px solid #374151;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="#" class="nav-logo">Chatbox<span>.ai</span></a>
        <div class="nav-middle">
          <div class="nav-status">
            <span
              style="
                width: 8px;
                height: 8px;
                background: #34d399;
                border-radius: 50%;
                display: inline-block;
              "
            ></span>
            <span style="font-size: 0.85rem; color: #94a3b8">المتصل</span>
          </div>
          <div class="lang-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ar">AR</button>
            <button class="lang-btn" data-lang="lb">LB</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="app-container">
      <aside class="sidebar">
        <h3>المحادثات</h3>
        <button class="btn new-chat" id="new-chat">محادثة جديدة</button>
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <main class="chat-area">
        <div class="chat-header">
          <h2 id="chat-title">محادثة جديدة</h2>
          <p>تواصل مع نموذج الذكاء الاصطناعي</p>
          <label
            style="
              display: inline-flex;
              gap: 0.5rem;
              align-items: center;
              margin-top: 0.5rem;
              font-size: 0.85rem;
              color: #94a3b8;
            "
          >
            <span>نوع المهمة</span>
            <select id="task-select">
              <option value="general" selected>عام</option>
              <option value="reasoning">استدلال</option>
              <option value="coding">برمجة</option>
              <option value="research">بحث</option>
              <option value="security">أمن</option>
              <option value="legal">قانون</option>
            </select>
          </label>
        </div>

        <div class="messages" id="messages">
          <div class="message ai">
            <div class="bubble">
              مرحباً! أنا نموذج الذكاء الاصطناعي الخاص بك. كيف يمكنني مساعدتك
              اليوم؟
            </div>
          </div>
        </div>

        <div class="typing" id="typing" hidden>
          <div class="bubble ai">يكتب...</div>
        </div>

        <div class="upload-zone" id="upload-zone" hidden>
          <span id="upload-name">لم يتم اختيار ملف</span>
          <button type="button" id="remove-file">إزالة</button>
          <input type="file" id="file-input" hidden />
        </div>

        <form class="input-form" id="input-form">
          <input
            type="text"
            id="user-input"
            placeholder="اكتب رسالتك هنا..."
            autocomplete="off"
          />
          <button type="button" id="attach-btn" class="attach-btn">📎</button>
          <button type="submit" id="send-btn">إرسال</button>
        </form>
      </main>
    </div>

    <script>
      (function () {
        const form = document.getElementById("input-form");
        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const messages = document.getElementById("messages");
        const typing = document.getElementById("typing");
        const fileInput = document.getElementById("file-input");
        const uploadZone = document.getElementById("upload-zone");
        const uploadName = document.getElementById("upload-name");
        const removeFileBtn = document.getElementById("remove-file");
        const attachBtn = document.getElementById("attach-btn");
        const taskSelect = document.getElementById("task-select");
        let selectedFile = null;
        let isSending = false;
        let currentLang = "en";

        document
          .getElementById("lang-switcher")
          .querySelectorAll(".lang-btn")
          .forEach((btn) => {
            btn.onclick = () => {
              document
                .querySelectorAll(".lang-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              currentLang = btn.dataset.lang || "en";
            };
          });

        function scrollBottom() {
          messages.scrollTop = messages.scrollHeight;
        }

        function addMessage(role, content) {
          const msg = document.createElement("div");
          msg.className = `message ${role}`;
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = content;
          msg.appendChild(bubble);
          messages.appendChild(msg);
          scrollBottom();
          return msg;
        }

        function setTyping(show) {
          typing.hidden = !show;
          if (show) scrollBottom();
        }

        attachBtn.onclick = () => fileInput.click();
        fileInput.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok) {
            selectedFile = data.file_path;
            uploadName.textContent = data.filename;
            uploadZone.hidden = false;
          }
        };
        removeFileBtn.onclick = () => {
          selectedFile = null;
          uploadZone.hidden = true;
          fileInput.value = "";
        };

        async function sendMessage() {
          const text = input.value.trim();
          if (!text && !selectedFile) return;
          if (isSending) return;

          isSending = true;
          input.disabled = true;
          sendBtn.disabled = true;
          sendBtn.textContent = "جاري الإرسال...";

          addMessage("user", text);
          input.value = "";
          setTyping(true);

          try {
            const res = await fetch("/api/chat/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                conversationId: Date.now(),
                message: text,
                lang: currentLang,
                task_type: taskSelect ? taskSelect.value : "general",
                file_path: selectedFile || null,
              }),
            });

            if (!res.ok || !res.body) {
              throw new Error("فشل الاتصال بالخادم");
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let aiMsg = null;

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop() || "";
              for (const line of lines) {
                const trimmed = line.trim();
                if (
                  !trimmed ||
                  trimmed === "[DONE]" ||
                  trimmed === "data: [DONE]"
                )
                  continue;
                if (trimmed.startsWith("data: ")) {
                  try {
                    const parsed = JSON.parse(trimmed.slice(6));
                    if (parsed.error) {
                      setTyping(false);
                      addMessage("ai", "خطأ: " + parsed.error);
                      return;
                    }
                    if (parsed.thinking) {
                      if (!aiMsg) aiMsg = addMessage("ai", "");
                      let thinkEl = aiMsg.querySelector(".thinking");
                      if (!thinkEl) {
                        thinkEl = document.createElement("div");
                        thinkEl.className = "thinking";
                        thinkEl.style.cssText =
                          "font-size:0.8rem;color:#94a3b8;font-style:italic;margin-bottom:0.4rem;white-space:pre-wrap;";
                        aiMsg.querySelector(".bubble").before(thinkEl);
                      }
                      thinkEl.textContent += parsed.thinking;
                      scrollBottom();
                      continue;
                    }
                    if (parsed.message?.content) {
                      if (!aiMsg) aiMsg = addMessage("ai", "");
                      aiMsg.querySelector(".bubble").textContent +=
                        parsed.message.content;
                      scrollBottom();
                    }
                  } catch {}
                }
              }
            }

            setTyping(false);
            selectedFile = null;
            uploadZone.hidden = true;
            fileInput.value = "";
          } catch (err) {
            console.error(err);
            setTyping(false);
            addMessage(
              "ai",
              "عذراً، حدث خطأ في الاتصال بالنموذج. تأكد من تشغيل Ollama.",
            );
          } finally {
            isSending = false;
            input.disabled = false;
            sendBtn.disabled = false;
            sendBtn.textContent = "إرسال";
            input.focus();
          }
        }

        form.onsubmit = (e) => {
          e.preventDefault();
          sendMessage();
        };
        input.onkeydown = (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        };
      })();
    </script>
  </body>
</html>
