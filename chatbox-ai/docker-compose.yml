version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=change-me-secret
      # The FastAPI app owns routing; ai-assistant publishes host port 8100.
      - AI_API_BASE=http://host.docker.internal:8100
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
