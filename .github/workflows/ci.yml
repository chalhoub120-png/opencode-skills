name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (ai-assistant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-assistant
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  node-syntax:
    name: Node syntax check (chatbox-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbox-ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/js/app.js
          node --check public/js/admin.js
          node --check public/js/i18n.js
